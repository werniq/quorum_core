# Extends docker-compose.e2e.yml for real-container validation.
# Alert mock is on the compose network so Quorum does not need host.docker.internal.
services:
  alert-mock:
    image: node:22-bookworm-slim
    command:
      [
        "node",
        "-e",
        "const http=require('http');const fs=require('fs');const log='/tmp/alerts.log';fs.writeFileSync(log,'');http.createServer((q,s)=>{let b=[];q.on('data',d=>b.push(d));q.on('end',()=>{const body=Buffer.concat(b).toString();if(q.method==='POST'){fs.appendFileSync(log,new Date().toISOString()+' '+body+'\\n');console.log('ALERT',body.slice(0,200));}s.writeHead(200);s.end('ok');});}).listen(8080,'0.0.0.0');",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/').then(r=>process.exit(0)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - quorum-e2e

  quorum:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      n8n:
        condition: service_healthy
      alert-mock:
        condition: service_started
