services:
  n8n:
    image: ${N8N_IMAGE:-n8nio/n8n:1.95.3}
    ports:
      - "${N8N_HOST_PORT:-5678}:5678"
    environment:
      N8N_HOST: "0.0.0.0"
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_LISTEN_ADDRESS: "0.0.0.0"
      WEBHOOK_URL: http://n8n:5678/
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Owner setup + API keys require user management for e2e automation.
      N8N_USER_MANAGEMENT_DISABLED: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-test-encryption-key-32chars!!}
      N8N_SECURE_COOKIE: "false"
      # Allow Code node require('crypto') for legacy / e2e HMAC signing harnesses.
      # Recommended operator path uses Crypto nodes (no allow-list): examples/n8n/quorum-signed-heartbeat.json
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      GENERIC_TIMEZONE: UTC
    volumes:
      - n8n-e2e-data:/home/node/.n8n
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:5678/healthz || wget -qO- http://127.0.0.1:5678/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    networks:
      - quorum-e2e

  quorum:
    build: .
    ports:
      - "${QUORUM_HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: file:/data/quorum.sqlite
      QUORUM_EDITION: self_hosted
      QUORUM_TELEMETRY_ENABLED: "false"
      QUORUM_CREDENTIAL_KEK: ${QUORUM_CREDENTIAL_KEK:?set QUORUM_CREDENTIAL_KEK}
      QUORUM_SETUP_TOKEN: ${QUORUM_SETUP_TOKEN:?set QUORUM_SETUP_TOKEN}
      QUORUM_UI_AUTH_ENABLED: ${QUORUM_UI_AUTH_ENABLED:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:3000}
      WATCHER_INTERVAL_MS: "5000"
      WATCHER_STALE_MS: "60000"
      OUTBOX_INTERVAL_MS: "5000"
      N8N_POLL_SCHEDULER_INTERVAL_MS: "5000"
      N8N_POLL_DEFAULT_INTERVAL_MS: "5000"
    volumes:
      - quorum-e2e-data:/data
    depends_on:
      n8n:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    networks:
      - quorum-e2e

volumes:
  n8n-e2e-data:
  quorum-e2e-data:

networks:
  quorum-e2e:
    driver: bridge
