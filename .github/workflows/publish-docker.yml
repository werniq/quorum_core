name: Publish Docker image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version only (e.g. 0.1.0-beta.12 or latest) — not a full image name"
        required: true
        default: "0.1.0-beta.12"

permissions:
  contents: read

jobs:
  dockerhub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require Docker Hub secrets
        shell: bash
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::Add repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (Docker Hub Access Token with Read & Write)."
            exit 1
          fi

      - name: Derive image tags
        id: meta
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$RAW_TAG"
          # Accept accidental full refs like qniw984/quorum:0.1.0-beta.12
          if [[ "$TAG" == *:* ]]; then
            TAG="${TAG##*:}"
          fi
          TAG="${TAG#v}"
          if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid image tag '$TAG'. Use a version only, e.g. 0.1.0-beta.12"
            exit 1
          fi
          IMAGE="${DOCKERHUB_USERNAME}/quorum"
          if [ "$TAG" = "latest" ]; then
            TAGS="${IMAGE}:latest"
          else
            TAGS="${IMAGE}:${TAG},${IMAGE}:latest"
          fi
          echo "version_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Publishing: $TAGS"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
